<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>buttonActivation</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="button-container">
      <button class="btn" data-target="section-1">Section-1</button>
      <button class="btn" data-target="section-2">Section-2</button>
      <button class="btn" data-target="section-3">Section-3</button>
    </div>
    <div id="section-container">
      <section id="section-1" class="section active">
        <h1>Section-1</h1>
      </section>

      <section id="section-2" class="section"><h1>Section-2</h1></section>
      <section id="section-3" class="section"><h1>Section-3</h1></section>
    </div>
    <script src="script.js"></script>
  </body>
</html>
